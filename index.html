<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="icon" href="icons/icon_512.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!--Título de página-->
    <header><h1>TODO LIST</h1></header>

    <div id="auth-view">
        <h1>Iniciar sesión</h1>
        <input id="auth-username" type="text" placeholder="Nombre de usuario">
        <input id="auth-password" type="password" placeholder="Contraseña">
        <button id="btn-login">Entrar</button>
        <button id="btn-signup">Crear cuenta</button>
    </div>

    <!--Contenido principal-->
    <main>
        <div id="app-view" hidden>
            <div id="principal">
                <h2>Add your task</h2>
                <div>
                    <input name="input-task" id="input-task" type="text">
                    <button id="btn-add">+</button>
                </div>
            </div>
            <div id="tasks"></div>
        </div>
    </main>
    <!--Script principal de la página-->
    <script src="/todo-list/js/vendor/supabase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
